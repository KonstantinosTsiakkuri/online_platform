# Конфиг nginx для проекта. Монтируется в контейнер nginx:alpine как /etc/nginx/conf.d/default.conf.
# Nginx единственный сервис, доступный снаружи (порт 80); приложение (gunicorn) слушает только во внутренней сети.

upstream django_app {
    server app:8000;
}

server {
    listen 80;
    server_name _;

    # Максимальный размер загружаемых файлов (превью, аватары)
    client_max_body_size 20m;

    # Статика (админка, Swagger) — собранная командой collectstatic в общий volume
    location /static/ {
        alias /app/staticfiles/;
        expires 7d;
        access_log off;
    }

    # Загруженные пользователями файлы — общий volume media_data
    location /media/ {
        alias /app/media/;
        expires 7d;
    }

    # Всё остальное — на gunicorn
    location / {
        proxy_pass http://django_app;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}
